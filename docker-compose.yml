version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb-optimizer-api
    ports:
      - "8000:8000"
    networks:
      - optimizer-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airbnb-optimizer-web
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:8000
      - NODE_ENV=production
      # Variables Clerk, Supabase, Stripe à injecter via .env.local
      # ou docker-compose.override.yml en production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - optimizer-network
    restart: unless-stopped

networks:
  optimizer-network:
    driver: bridge
